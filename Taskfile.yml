# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  inspect:
    desc: Run MCP Inspector against the local server
    cmds:
      - npx -y @modelcontextprotocol/inspector dotnet run --project src/DotnetTest.Mcp -c Release
